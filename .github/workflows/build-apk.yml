name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages
        shell: bash
        run: |
          set +e
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1
          "$SDKMGR" "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"
          [ -x "$ANDROID_HOME/build-tools/36.1.0/aapt2" ] || { echo "build-tools install failed"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  design-qa:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages
        shell: bash
        run: |
          set +e
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1
          "$SDKMGR" "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"
          [ -x "$ANDROID_HOME/build-tools/36.1.0/aapt2" ] || { echo "build-tools install failed"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Record design screenshots
        run: gradle --no-daemon recordRoborazziDebug --tests "com.example.DesignPreviewTest" --continue || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-screenshots
          path: app/src/test/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
